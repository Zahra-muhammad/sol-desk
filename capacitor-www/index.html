<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>sol</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #191919;
        color: #ececec;
        font: 15px/1.5 -apple-system, system-ui, sans-serif;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      .av {
        width: 84px;
        height: 84px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 32px;
        color: #111;
        background: conic-gradient(from 200deg, #ff6fc1, #4c6bff, #ffc93c, #ff6fc1);
      }
      p {
        color: #8a8a8a;
        max-width: 280px;
        margin: 0;
      }
      button {
        margin-top: 6px;
        height: 40px;
        padding: 0 18px;
        border: 0;
        border-radius: 99px;
        background: #ececec;
        color: #0b0b0b;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="av">S</div>
      <b>Your desk can’t be reached</b>
      <p>Check your connection, then try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
