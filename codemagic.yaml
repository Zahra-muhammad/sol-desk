# Builds the sol iOS app on a cloud Mac (no Mac needed) and sends it to TestFlight.
# Setup is in README.md → "iPhone app". You need an Apple Developer account.
workflows:
  ios-testflight:
    name: sol — iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      # The App Store Connect API key you add in Codemagic (Team settings → Integrations), with this name.
      app_store_connect: sol-asc-key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.soldesk.planner
      vars:
        # Set CAP_SERVER_URL in Codemagic → Environment variables (your production address, e.g. https://your-app.vercel.app).
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Check the desk address
        script: |
          if [ -z "$CAP_SERVER_URL" ]; then echo "Set CAP_SERVER_URL in Codemagic environment variables"; exit 1; fi
      - name: Sync the web app into the iOS project
        script: npx cap sync ios
      - name: Set up signing
        script: xcode-project use-profiles
      - name: Bump build number
        # Codemagic's BUILD_NUMBER goes up by one for every build of this workflow.
        script: |
          cd ios/App
          agvtool new-version -all $((BUILD_NUMBER + 1))
      - name: Build
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
